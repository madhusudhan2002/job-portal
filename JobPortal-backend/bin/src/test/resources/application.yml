spring:
  datasource:
    url: jdbc:h2:mem:jobportal_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32-chars-minimum
    expiration-ms: 3600000
